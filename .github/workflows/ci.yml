name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run installer contract tests
        run: python -m pytest -q

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            install-openssh.ps1
            install-zeaz-openssh.ps1
            install-zeaz-openssh.cmd
            README.md
            ABOUT.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            CHANGELOG.md
            ROADMAP.md
            IMPLEMENTATION-CHECKLIST.md
            docs/architecture.md
            docs/development.md
            docs/release.md
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

      - name: Reject tracked secret-bearing filenames
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret-bearing file is tracked.'
            exit 1
          fi

      - name: Validate workflow YAML syntax
        shell: bash
        run: ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.load_file(f); puts "ok #{f}" }'

  powershell-parse:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell entry points
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('install-openssh.ps1', 'install-zeaz-openssh.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-Host
              throw "PowerShell parse failed: $file"
            }
            Write-Host "Parsed: $file"
          }
